    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('techsphere_theme_v2');
          var theme = saved === 'dark' ? 'dark' : 'light';
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.classList.toggle('light', theme === 'light');
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
          if (window.sessionStorage.getItem('techsphere_fonts_loaded_v1') === '1') {
            root.classList.add('ts-fonts-loaded');
            root.setAttribute('data-fonts-status', 'loaded');
          } else {
            root.setAttribute('data-fonts-status', 'system');
          }
        } catch (e) {}
      })();
    </script>
